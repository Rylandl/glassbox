[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassbox"
version = "0.3.0rc1"
description = "Differentiable rigid-body dynamics learned from recordings"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ryland Lillibridge" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "jax>=0.11.1",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.urls]
Repository = "https://github.com/Rylandl/glassbox"

[project.scripts]
glassbox = "glassbox.cli:main"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/docs", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.16.5,<0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]
ignore = ["B905", "RUF005"]
