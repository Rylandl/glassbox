[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassbox"
version = "0.1.0"
description = "Telemetry-driven differentiable vehicle dynamics identification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jax>=0.4.35",
    "numpy>=1.26",
    "pymavlink>=2.4.49",
    "pyulog>=1.2.2",
    "rosbags>=0.11.5",
]

[project.optional-dependencies]
cascade = [
    "cascade-flight",
]
crazyflow = [
    "crazyflow==0.3.2",
]
crazyflow-animation = [
    "crazyflow==0.3.2",
    "pillow>=10",
]

[project.scripts]
glassbox-fit = "glassbox.fit_cli:main"
glassbox-prior = "glassbox.parameter_prior_cli:main"
glassbox-adaptation-benchmark = "glassbox.adaptation_benchmark:main"
glassbox-adaptive-recovery = "glassbox.adaptive_recovery_benchmark:main"
glassbox-synthetic = "glassbox.demo:main"
glassbox-ulog = "glassbox.ulog_cli:main"
glassbox-sitl-profile = "glassbox.sitl_profile:main"
glassbox-profile-benchmark = "glassbox.profile_benchmark:main"
glassbox-source-benchmark = "glassbox.source_group_benchmark:main"
glassbox-ensemble-benchmark = "glassbox.predictive_ensemble:main"
glassbox-fixedwing-synthetic = "glassbox.fixedwing_cli:main"
glassbox-fixedwing-gate = "glassbox.fixedwing_gate:main"
glassbox-fixedwing-sitl-profile = "glassbox.fixedwing_sitl_profile:main"
glassbox-nanodrone = "glassbox.nanodrone_cli:main"
glassbox-x8 = "glassbox.x8_cli:main"
glassbox-epfl = "glassbox.epfl_cli:main"
glassbox-select-policy = "glassbox.policy_selection:main"
glassbox-nmpc-benchmark = "glassbox.nmpc_benchmark:main"
glassbox-px4-nmpc-shadow = "glassbox.integrations.px4_nmpc_shadow:main"
glassbox-crazyflow-prototype = "glassbox.integrations.crazyflow_prototype:main"
glassbox-crazyflow-bootstrap = "glassbox.integrations.crazyflow_bootstrap:main"
glassbox-crazyflow-animation = "glassbox.integrations.crazyflow_animation:main"
glassbox-crazyflow-throw = "glassbox.integrations.crazyflow_throw:main"
glassbox-crazyflow-throw-animation = "glassbox.integrations.crazyflow_animation:throw_main"

[tool.uv.sources]
cascade-flight = { git = "https://github.com/Rylandl/cascade", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.5,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cascade: opt-in contracts against the local Cascade fixed-wing simulator",
    "crazyflow: opt-in contracts against the pinned Crazyflow simulator",
    "px4_sitl: opt-in contract tests against a disposable PX4 SIH container",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]
ignore = [
    # Existing call sites mix exact and truncating semantics; audit those
    # invariants before enforcing strict zip project-wide.
    "B905",
    # Tuple concatenation is clearer for the NumPy shape expressions in use.
    "RUF005",
]
