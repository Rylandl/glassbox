name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests examples scripts
      - run: uv run ruff format --check src tests examples scripts

  installed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv build --python ${{ matrix.python-version }}
      - run: |
          uv venv "$RUNNER_TEMP/glassbox-wheel" --python ${{ matrix.python-version }}
          uv pip install --python "$RUNNER_TEMP/glassbox-wheel/bin/python" dist/*.whl pytest
      - name: Test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/glassbox-wheel/bin/python" -c 'import sys, glassbox; from pathlib import Path; assert Path(glassbox.__file__).is_relative_to(sys.prefix)'
          "$RUNNER_TEMP/glassbox-wheel/bin/glassbox" --help
          "$RUNNER_TEMP/glassbox-wheel/bin/python" -m pytest --import-mode=importlib -q \
            "$GITHUB_WORKSPACE/tests/test_cli.py" \
            "$GITHUB_WORKSPACE/tests/test_forecast.py" \
            "$GITHUB_WORKSPACE/tests/test_learner.py"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run pytest -q
